name: UNLABELED-SUM-ID-FRAGMENTED
description: "Single-client full scan after deleting every even node ID from one million unlabeled nodes."
db_config:
  init_commands:
    - ["GRAPH.QUERY", "graph", "UNWIND range(0, 999999) AS x CREATE ()"]
    - ["GRAPH.QUERY", "graph", "MATCH (n) WHERE id(n) % 2 = 0 DELETE n"]
parameters:
  graph: graph
  num_clients: 1
  num_requests: 20
  queries:
    - query: "MATCH (n) RETURN sum(id(n))"
      ratio: 1.0
